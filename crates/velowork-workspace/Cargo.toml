[package]
name = "velowork-workspace"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
velowork-core = { path = "../velowork-core" }
velowork-security = { path = "../velowork-security" }
velowork-terminal = { path = "../velowork-terminal" }
velowork-layout = { path = "../velowork-layout" }
velowork-state = { path = "../velowork-state" }
velowork-i18n = { path = "../velowork-i18n" }

gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
uuid = { version = "1.10", features = ["v4"] }
log = "0.4"
tokio = { version = "1", features = ["sync"] }
futures = "0.3"
dirs = "5.0"
anyhow = "1.0"
smol = "2.0"
libc = "0.2"

# Security - credential encryption and keychain access
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
keyring = "4.1"
thiserror = "1.0"

# WebDAV sync
reqwest_dav = "0.3"
chrono = { version = "0.4", features = ["serde"] }

# Sync bundle compression + hashing
zstd = "0.13"

# Session importers (Xshell, MobaXterm, WindTerm, FinalShell)
zip = { version = "2.2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
sha3 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", features = ["test-support"] }
tempfile = "3"
