[package]
name = "velowork-security"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
velowork-core = { path = "../velowork-core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
parking_lot = "0.12"

# 密码学原语
zeroize = { version = "1.8", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
zstd = "0.13"

# 密钥库后端 + 时间
keyring = "4.1"
chrono = { version = "0.4", features = ["serde"] }

# SQLite（与 velowork-core 同一版本，由 cargo 去重为单一实例）
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
