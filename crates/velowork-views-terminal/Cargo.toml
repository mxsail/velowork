[package]
name = "velowork-views-terminal"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
velowork-core = { path = "../velowork-core" }
velowork-state = { path = "../velowork-state" }
velowork-extensions = { path = "../velowork-extensions" }
velowork-terminal = { path = "../velowork-terminal" }
velowork-workspace = { path = "../velowork-workspace" }
velowork-app-core = { path = "../velowork-app-core" }
velowork-ui = { path = "../velowork-ui" }
velowork-i18n = { path = "../velowork-i18n" }

gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }

alacritty_terminal = "0.25"
image = "0.25"
parking_lot = "0.12"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
async-trait = "0.1"
smol = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util"] }
russh = "0.62.2"
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "p256", "p384", "p521", "encryption", "ppk", "sha1"] }
ssh-encoding = "0.3"
russh-sftp = "2.3.0"
