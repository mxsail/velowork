[package]
name = "velowork-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemalloc-sys"]
# Exposes `process::testing` (command bus mock) to downstream crates' tests.
test-support = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
alacritty_terminal = "0.25"
log = "0.4"
dirs = "5.0"
anyhow = "1.0"
encoding_rs = "0.8"

# Embedded SQLite for the single Profile business database (velowork.db).
# `bundled` compiles SQLite from source so no system libsqlite3 is required.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tikv-jemalloc-sys = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
